<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop File Indexer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0f0f13;
            color: #e0e0e0;
            min-height: 100vh;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .header p {
            color: #888;
            font-size: 0.95rem;
        }

        /* Stats bar */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .stat-item {
            text-align: center;
            background: #1a1a24;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #2a2a3a;
            min-width: 120px;
        }

        .stat-item .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-item .label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 2px;
        }

        /* Search box */
        .search-container {
            margin-bottom: 30px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 16px;
            padding: 6px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-box:focus-within {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e0e0e0;
            font-size: 1.1rem;
            padding: 12px 16px;
        }

        .search-box input::placeholder {
            color: #555;
        }

        .search-box button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        .search-box button:hover {
            opacity: 0.9;
        }

        .search-box button:active {
            transform: scale(0.97);
        }

        .search-box button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Filter bar */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            color: #888;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #667eea;
            color: #ccc;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
            color: white;
        }

        /* Results */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            font-size: 0.9rem;
            color: #888;
        }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .result-item {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 16px 20px;
            transition: border-color 0.2s, background 0.2s;
            cursor: pointer;
        }

        .result-item:hover {
            border-color: #667eea;
            background: #1e1e2a;
        }

        .result-item .filename {
            font-size: 1.05rem;
            font-weight: 600;
            color: #e0e0e0;
            margin-bottom: 4px;
            word-break: break-all;
        }

        .result-item .filepath {
            font-size: 0.85rem;
            color: #667eea;
            margin-bottom: 8px;
            word-break: break-all;
        }

        .result-item .meta {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            color: #666;
        }

        .result-item .meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .result-item .meta .badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: 500;
            background: #2a2a3a;
            color: #aaa;
        }

        .result-item .meta .badge.text { background: #1a3a2a; color: #4ade80; }
        .result-item .meta .badge.code { background: #1a2a3a; color: #60a5fa; }
        .result-item .meta .badge.image { background: #2a1a3a; color: #c084fc; }
        .result-item .meta .badge.document { background: #3a2a1a; color: #fbbf24; }
        .result-item .meta .badge.audio { background: #1a3a3a; color: #34d399; }
        .result-item .meta .badge.video { background: #3a1a1a; color: #f87171; }
        .result-item .meta .badge.archive { background: #2a2a1a; color: #facc15; }
        .result-item .meta .badge.web { background: #1a2a2a; color: #2dd4bf; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #555;
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state h3 {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 8px;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid #2a2a3a;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Index button */
        .index-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn-secondary {
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            color: #888;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-secondary:hover {
            border-color: #667eea;
            color: #ccc;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #1a1a24;
            border: 1px solid #2a2a3a;
            padding: 12px 24px;
            border-radius: 12px;
            color: #e0e0e0;
            font-size: 0.9rem;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: #4ade80; }
        .toast.error { border-color: #f87171; }

        /* Responsive */
        @media (max-width: 600px) {
            .container { padding: 20px 16px; }
            .header h1 { font-size: 1.6rem; }
            .search-box { flex-direction: column; }
            .search-box button { width: 100%; }
            .stats-bar { gap: 10px; }
            .stat-item { min-width: 80px; padding: 10px 16px; }
        }

        /* Copy button */
        .copy-path-btn {
            background: transparent;
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            color: #888;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 8px;
            transition: all 0.2s;
        }
        .copy-path-btn:hover {
            border-color: #667eea;
            color: #ccc;
        }

        /* Memory observability */
        .memory-section {
            margin-bottom: 24px;
        }
        .memory-panel {
            background: #11111a;
            border: 1px solid #2a2a3a;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
        }
        .memory-toolbar {
            gap: 10px;
            align-items: center;
            justify-content: space-between;
            color: #888;
            font-size: .85rem;
        }
        .memory-entry {
            background: #14141f;
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 14px;
            word-wrap: break-word;
        }
        .memory-entry-header {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            color: #888;
            font-size: .78rem;
            margin-bottom: 6px;
        }
        .memory-entry-body {
            color: #e0e0e0;
            font-size: .95rem;
            line-height: 1.45;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🔍 ZQM Node-01 Workstation Indexer</h1>
            <p>Search every file on your workstation instantly</p>
        </div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="value" id="fileCount">-</div>
                <div class="label">Files Indexed</div>
            </div>
            <div class="stat-item">
                <div class="value" id="lastIndexed">-</div>
                <div class="label">Last Indexed</div>
            </div>
            <div class="stat-item">
                <div class="value" id="totalFiles">-</div>
                <div class="label">Total Found</div>
            </div>
        </div>

        <!-- Memory Observability -->
        <div id="memorySection" class="memory-section">
            <div id="memoryPanel" class="memory-panel">
                <div class="loading"><div class="spinner"></div></div>
            </div>
            <div class="memory-toolbar" style="display:flex;">
                <div style="font-weight:600;color:#e0e0e0;">🧠 Hermes Memory</div>
                <div style="display:flex;gap:10px;align-items:center;">
                    <span id="memoryEntryCount">Entries: -</span>
                    <span id="memoryStats">-</span>
                    <span id="memoryUsage">-</span>
                    <button class="copy-path-btn" onclick="copyMemoryAsMarkdown()">📝 Copy Markdown</button>
                    <button class="copy-path-btn" onclick="refreshMemory()">🔄 Refresh</button>
                </div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search files by name, content, or type..." autofocus>
                <button id="searchBtn" onclick="doSearch()">Search</button>
            </div>
        </div>

        <!-- Filters -->
        <div class="filter-bar" id="filterBar">
            <button class="filter-btn active" data-filter="" onclick="setFilter(this, '')">All</button>
            <button class="filter-btn" data-filter="text/plain" onclick="setFilter(this, 'text/plain')">Text</button>
            <button class="filter-btn" data-filter="text/code" onclick="setFilter(this, 'text/code')">Code</button>
            <button class="filter-btn" data-filter="document" onclick="setFilter(this, 'document')">Documents</button>
            <button class="filter-btn" data-filter="image" onclick="setFilter(this, 'image')">Images</button>
            <button class="filter-btn" data-filter="audio" onclick="setFilter(this, 'audio')">Audio</button>
            <button class="filter-btn" data-filter="video" onclick="setFilter(this, 'video')">Video</button>
            <button class="filter-btn" data-filter="archive" onclick="setFilter(this, 'archive')">Archives</button>
        </div>

        <!-- Results -->
        <div id="resultsArea">
            <div class="empty-state">
                <div class="icon">📂</div>
                    <h3>Search your workstation</h3>
                    <p>Type a query above to find files across your entire computer</p>
            </div>
        </div>

        <!-- Index Controls -->
        <div class="index-controls">
            <button class="btn-secondary" onclick="triggerIndex(false)" id="indexBtn">🔄 Update Index</button>
            <button class="btn-secondary" onclick="triggerIndex(true)" id="rebuildBtn">🗑️ Rebuild Index</button>
        </div>
    </div>

    <!-- Toast -->
    <!-- Memory Observability -->
    <div id="memorySection" style="margin-bottom:28px;">
        <div id="memoryPanel" style="background:#11111a;border:1px solid #2a2a3a;border-radius:14px;padding:14px;margin-bottom:10px;">
            <div class="loading"><div class="spinner"></div></div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#888;font-size:.85rem;">
            <div style="font-weight:600;color:#e0e0e0;">🧠 Hermes Memory</div>
            <div style="display:flex;gap:10px;align-items:center;">
                <span id="memoryEntryCount">Entries: -</span>
                <span id="memoryUsage">-</span>
                <button class="copy-path-btn" onclick="copyMemoryAsMarkdown()">📝 Copy Markdown</button>
                <button class="copy-path-btn" onclick="refreshMemory()">🔄 Refresh</button>
            </div>
        </div>
    </div>
    <!-- Search -->
    <div class="search-container">
    <script>
    let currentFilter = '';
    let currentQuery = '';
    async function refreshMemory(){
      const panel=document.getElementById('memoryPanel');
      const count=document.getElementById('memoryEntryCount');
      const usage=document.getElementById('memoryUsage');
      panel.innerHTML='<div class="loading"><div class="spinner"></div></div>';
      try{
        const r=await fetch('/api/memory');
        const data=await r.json();
        const entries=data.memory_entries || [];
        count.textContent='Entries: ' + entries.length;
        const memBytes = (data.MEMORY_md || '').length;
        const memChars = memBytes;
        const memLimit = 2200;
        usage.textContent='Memory ' + memChars.toLocaleString() + '/' + memLimit.toLocaleString() + ' chars';
        if(!entries.length){
          panel.innerHTML='<div class="empty-state"><h3>No memory entries yet</h3></div>';
          return;
        }
        let html='<div style="display:flex;flex-direction:column;gap:10px;">';
        entries.forEach((entry, idx) => {
          const len = (entry || '').length;
          const safeEntry = escapeHtml(entry || '').replace(/\\n/g, '<br>');
          html += `<div style="background:#14141f;border:1px solid #2a2a3a;border-radius:12px;padding:14px;word-wrap:break-word;">
            <div style="display:flex;justify-content:space-between;gap:8px;color:#888;font-size:.78rem;margin-bottom:6px;">
              <span>Entry ${idx + 1}</span>
            </div>
            <div style="color:#e0e0e0;font-size:.95rem;">${safeEntry || '<span style="color:#666">(empty)</span>'}</div>
            <div style="color:#666;font-size:.75rem;margin-top:6px;">${len.toLocaleString()} chars</div>
          </div>`;
        });
        html += '</div>';
        panel.innerHTML = html;
      }catch(err){
        panel.innerHTML='<div class="empty-state"><h3>Memory failed</h3><p>' + err.message + '</p></div>';
      }
    }
    function copyMemoryAsMarkdown(){
      const data = window.cachedMemoryPayload;
      if(!data){
        showToast('Press Refresh first', 'error');
        return;
      }
      const entries = data.memory_entries || [];
      const mem = data.MEMORY_md || '';
      const user = data.USER_md || '';
      const md = '# Hermes Memory\n\n## MEMORY.md\n\n```\n' + mem + '\n```\n\n## USER.md\n\n```\n' + user + '\n```\n\n## Rendered entries\n\n' + entries.map((e, i) => (i+1)+'. ' + e.split('\n').shift()).join('\n');
      navigator.clipboard.writeText(md).then(()=>showToast('Memory markdown copied','success')).catch(()=>showToast('Copy failed','error'));
    }
    async function loadMemory(){
      try{
        const r = await fetch('/api/memory');
        const data = await r.json();
        window.cachedMemoryPayload = data;
        return refreshMemory();
      }catch(err){
        showToast('Memory load failed','error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => { loadStats(); loadMemory(); });

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        function loadStats() {
            fetch('/api/stats')
                .then(r => r.json())
                .then(data => {
                    if (data.document_count > 0) {
                        document.getElementById('fileCount').textContent = data.document_count.toLocaleString();
                        document.getElementById('totalFiles').textContent = (data.config?.total_files || '-').toLocaleString();
                        const lastIdx = data.config?.last_indexed;
                        if (lastIdx) {
                            const d = new Date(lastIdx);
                            document.getElementById('lastIndexed').textContent = d.toLocaleString();
                        } else {
                            document.getElementById('lastIndexed').textContent = '-';
                        }
                    } else {
                        document.getElementById('fileCount').textContent = '0';
                        document.getElementById('lastIndexed').textContent = 'Never';
                        document.getElementById('totalFiles').textContent = '0';
                    }
                })
                .catch(() => {
                    document.getElementById('fileCount').textContent = '?';
                    document.getElementById('lastIndexed').textContent = 'Offline';
                    document.getElementById('totalFiles').textContent = '?';
                });
        }

        function setFilter(btn, filter) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = filter;
            if (currentQuery) doSearch();
        }

        function doSearch() {
            const query = document.getElementById('searchInput').value.trim();
            currentQuery = query;

            if (!query) {
                document.getElementById('resultsArea').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <h3>Search your desktop</h3>
                        <p>Type a query above to find files instantly</p>
                    </div>
                `;
                return;
            }

            const resultsArea = document.getElementById('resultsArea');
            resultsArea.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const baseUrl = `/api/search?q=${encodeURIComponent(query)}&limit=100`;
            const fields = ["filename","filetype","path","size","modified"];
            const url = baseUrl + '&' + fields.map(f => `fields=${encodeURIComponent(f)}`).join('&');

            fetch(url)
                .then(r => r.json())
                .then(data => {
                    let results = data.results || [];

                    // Apply type filter
                    if (currentFilter) {
                        results = results.filter(r => {
                            const parts = (r.filetype || '').split('/');
                            return parts[0] === currentFilter;
                        });
                    }

                    if (results.length === 0) {
                        resultsArea.innerHTML = `
                            <div class="empty-state">
                                <div class="icon">🔍</div>
                                <h3>No results found</h3>
                                <p>Try a different search term or update the index</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `
                        <div class="results-info">
                            <span>Found ${results.length} result${results.length !== 1 ? 's' : ''}</span>
                        </div>
                        <div class="results-list">
                    `;

                    results.forEach(r => {
                        const typeClass = r.filetype ? r.filetype.split('/')[0].replace('text/', '') : 'unknown';
                        const badgeClass = r.filetype ? r.filetype.split('/')[0] : 'unknown';
                        const shortPath = shortenPath(r.path || '');
                        const displayType = typeLabel(r.filetype);
                        const sourceLabel = r.source === 'metadata' ? ' ⚡ metadata' : '';
                        html += `
                            <div class="result-item" onclick="openFile('${r.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">
                                <div class="filename" title="${escapeHtml(r.path || '')}">${escapeHtml(r.filename)}${sourceLabel ? '<span style="margin-left:8px;font-size:.7rem;opacity:.8;color:#aaa;">' + sourceLabel.trim() + '</span>' : ''}</div>
                                <div class="filepath" title="${escapeHtml(r.path || '')}">${escapeHtml(shortPath)}</div>
                                <div class="meta">
                                    <span class="badge ${badgeClass}">${displayType}</span>
                                    <span>📄 ${r.size_formatted}</span>
                                    <span>🕐 ${r.modified_formatted}</span>
                                    <span>⭐ ${r.score.toFixed(1)}</span>
                                    <button class="copy-path-btn" onclick="event.stopPropagation(); copyPath('${r.path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')" title="Copy path">📋</button>
                                </div>
                            </div>
                        `;
                    });

                    html += '</div>';
                    resultsArea.innerHTML = html;
                })
                .catch(err => {
                    resultsArea.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">⚠️</div>
                            <h3>Search failed</h3>
                            <p>${err.message}</p>
                        </div>
                    `;
                });
        }

        function openFile(path) {
            fetch('/api/open', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path: path })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showToast('Opened file in Explorer', 'success');
                } else {
                    showToast('Could not open file: ' + (data.error || 'unknown'), 'error');
                }
            })
            .catch(() => showToast('Failed to open file', 'error'));
        }

        function copyPath(path) {
            navigator.clipboard.writeText(path).then(() => {
                showToast('Path copied to clipboard', 'success');
            }).catch(() => {
                showToast('Failed to copy path', 'error');
            });
        }

        function shortenPath(path) {
            if (!path) return '';
            const normalized = String(path).replace(/\\\\/g, '\\');
            if (normalized.length <= 70) return normalized;
            const parts = normalized.split('\\');
            const name = parts.pop() || '';
            const drive = parts.shift() || '';
            const prefix = drive ? drive + '\\' : '';
            if (parts.length) {
                return prefix + '…\\' + name;
            }
            return prefix + name;
        }

        const TYPE_LABELS = {
            'text/plain': 'Text',
            'text/code': 'Code',
            'text/web': 'Web',
            'text/xml': 'XML',
            'text/json': 'JSON',
            'text/markdown': 'Markdown',
            'image': 'Image',
            'audio': 'Audio',
            'video': 'Video',
            'document': 'Document',
            'archive': 'Archive',
            'application': 'App',
            'unknown': 'Unknown'
        };

        function typeLabel(mime) {
            if (!mime) return 'Unknown';
            if (TYPE_LABELS[mime]) return TYPE_LABELS[mime];
            const base = mime.split('/')[0];
            if (base === 'text') {
                const exact = TYPE_LABELS[mime];
                if (exact) return exact;
                return 'Text';
            }
            return TYPE_LABELS[base] || base.charAt(0).toUpperCase() + base.slice(1);
        }

        function triggerIndex(rebuild) {
            const btn = rebuild ? document.getElementById('rebuildBtn') : document.getElementById('indexBtn');
            btn.disabled = true;
            btn.textContent = rebuild ? '🗑️ Rebuilding...' : '🔄 Indexing...';
            showToast(rebuild ? 'Rebuilding index...' : 'Updating index...', 'success');

            fetch('/api/index', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ rebuild: rebuild })
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    showToast(`Index ${rebuild ? 'rebuilt' : 'updated'} successfully! ${data.config?.indexed_files || 0} files indexed.`, 'success');
                    loadStats();
                } else {
                    showToast('Error: ' + (data.error || 'unknown'), 'error');
                }
            })
            .catch(err => showToast('Error: ' + err.message, 'error'))
            .finally(() => {
                btn.disabled = false;
                btn.textContent = rebuild ? '🗑️ Rebuild Index' : '🔄 Update Index';
            });
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
